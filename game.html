<script>
// Set the date we're counting down to
var counting = false;
var time = 3; //Number of minutes per mission
//document.querySelector('input[name="difficulty"]:checked').value
var countDownDate = new Date(Date.now() + time * 60 * 1000 + 2000);
// Update the count down every 1 second

var x = setInterval(function() {

  // Get today's date and time
  var now = new Date().getTime();

  // Find the distance between now and the count down date
  var distance = countDownDate - now;

  // Time calculations for days, hours, minutes and seconds
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);

  // Display the result in the element with id="time-display"
  document.getElementById("time-display").innerHTML = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

  // If the count down is finished, write some text
  if (distance < 0) {
    clearInterval(x);
    updateScene("failure");
  }
}, 1000);

function startCountdown() {
  let counting = true;
}

function searchRoom(){
    if(seconds>=30){
        seconds-=30;
    } else {
        minutes-=1;
        seconds+=30;
    }
}
</script>
